version: '3.8'

services:
  buggy-auction-dashboard:
    build: .
    image: ghcr.io/techguyowen/buggydashboard:latest
    container_name: buggy-auction-dashboard
    restart: unless-stopped
    ports:
      - "7422:7422"
    volumes:
      - ./catalog_cache.json:/app/catalog_cache.json
    environment:
      - PORT=7422
      - HOST=0.0.0.0
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7422/api/progress"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

