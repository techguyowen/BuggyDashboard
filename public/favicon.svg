<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Radar Neon Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Radar Outer Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#radarGrad)" stroke-width="12" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="url(#radarGrad)" stroke-width="6" opacity="0.6" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="url(#radarGrad)" stroke-width="4" opacity="0.4" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="url(#radarGrad)" stroke-width="4" opacity="0.3" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="url(#radarGrad)" stroke-width="4" opacity="0.3" />

  <!-- Radar Sweep Cone -->
  <path d="M 256,256 L 380,132 A 180,180 0 0,0 256,76 Z" fill="url(#radarGrad)" opacity="0.35" filter="url(#glow)" />

  <!-- Radar Blips -->
  <circle cx="340" cy="170" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="200" cy="320" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="310" cy="310" r="8" opacity="0.8" fill="#6366f1" filter="url(#glow)" />

  <!-- Center Radar Core -->
  <circle cx="256" cy="256" r="24" fill="url(#radarGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>
